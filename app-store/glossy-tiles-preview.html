<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,sans-serif;margin:0;background:#f5f8fd;display:flex;justify-content:center}
  .wrap{width:430px;padding:16px 20px 32px}
  .row{display:flex;align-items:center;justify-content:space-between}
  .seg{display:inline-flex;background:#f1f5f9;border-radius:99px;padding:4px}
  .seg button{border:0;border-radius:99px;padding:8px 24px;font-size:14px;font-weight:700;cursor:pointer}
  .seg .on{background:#fff;color:#0f172a;box-shadow:0 2px 8px rgba(20,50,90,.16)}
  .seg .off{background:transparent;color:#64748b}
  .icobtn{position:relative;width:44px;height:44px;border-radius:99px;background:#fff;box-shadow:0 4px 12px -4px rgba(20,50,90,.25);display:flex;align-items:center;justify-content:center}
  .icobtn svg{width:20px;height:20px;stroke:#334155;fill:none;stroke-width:2}
  .nb{position:absolute;top:-3px;right:-3px;background:#2563EB;color:#fff;font-size:10px;font-weight:700;height:20px;min-width:20px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .av{width:44px;height:44px;border-radius:99px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#475569;font-size:14px}
  h1{font-size:38px;font-weight:800;color:#0f172a;margin:2px 0 0}
  .hi{font-size:19px;color:#64748b;font-weight:500;margin-top:24px}
  .search{margin-top:16px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:24px;padding:12px;box-shadow:0 20px 44px -22px rgba(20,50,90,.4)}
  .search .loc{flex:1;display:flex;align-items:center;gap:10px}
  .search .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#2563EB}
  .search input{border:0;outline:0;font-size:13px;color:#334155;width:100%}
  .filt{width:40px;height:40px;border-radius:99px;background:#f1f5f9;display:flex;align-items:center;justify-content:center}
  .filt svg{width:18px;height:18px;stroke:#475569;fill:none;stroke-width:2}
  .sbtn{display:flex;align-items:center;gap:6px;background:#2563EB;color:#fff;font-weight:700;font-size:14px;border-radius:99px;padding:12px 16px}
  .sbtn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4}
  h2{font-size:19px;font-weight:800;color:#0f172a;margin:28px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .tile{position:relative;display:flex;align-items:center;gap:10px;min-height:92px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 12px 26px -18px rgba(20,50,90,.45)}
  .tile .tt{flex:1;min-width:0}
  .tile .tl{font-size:13px;font-weight:800;color:#0f172a;line-height:1.1}
  .tile .td{font-size:10.5px;color:#64748b;line-height:1.15;margin-top:4px}
  .g{position:relative;width:46px;height:46px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center}
  .g svg{position:relative;width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2.4}
  .g .spec{position:absolute;top:15%;left:26%;width:22%;height:15%;border-radius:99px;background:radial-gradient(closest-side,rgba(255,255,255,1),rgba(255,255,255,0))}
  .banner{position:relative;overflow:hidden;margin-top:20px;background:#efeaff;border-radius:24px;padding:16px;display:flex;gap:12px;align-items:flex-start}
  .banner .bt{font-size:15px;font-weight:800;color:#0f172a}
  .banner .bd{font-size:12px;color:#475569;margin-top:4px;max-width:15rem;line-height:1.35}
  .banner .lm{margin-top:12px;background:#2563EB;color:#fff;font-weight:700;font-size:12.5px;border-radius:99px;padding:8px 16px;display:inline-block}
</style></head><body>
<div class="wrap">
  <div class="row">
    <div class="seg"><button class="on">Rent</button><button class="off">Buy</button></div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="icobtn"><span class="nb">2</span><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
      <div class="av">DT</div>
    </div>
  </div>
  <p class="hi">Welcome home,</p>
  <h1>Duane 👋</h1>
  <div class="search">
    <div class="loc">
      <span class="g" id="loc"></span>
      <div style="flex:1"><div class="lbl">Location</div><input placeholder="City, suburb or area…"></div>
    </div>
    <div class="filt"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></div>
    <div class="sbtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg> Search</div>
  </div>
  <h2>Manage your rental</h2>
  <div class="grid" id="grid"></div>
  <div class="banner">
    <span class="g" id="shield" style="width:48px;height:48px"></span>
    <div style="flex:1">
      <div class="bt">Why rent with MzanziHomes?</div>
      <div class="bd">Connect directly with landlords, enjoy zero agent fees, and manage everything in one secure place.</div>
      <div class="lm">Learn more</div>
    </div>
  </div>
</div>
<script>
  const tones={sapphire:['#7db0ff','#1f6bff','#0b3ca6'],emerald:['#7bea90','#22c55e','#12763a'],orange:['#ffb35f','#f97316','#a8420a'],purple:['#b492ff','#2563EB','#45177f'],cyan:['#54dcc9','#0f9e8e','#0a5b53'],indigo:['#6d8cf3','#2447c8','#132873'],teal:['#5ce7d6','#14b8a6','#0a6d63'],ruby:['#ff8072','#ef4444','#a01818'],amber:['#ffce63','#f4a009','#a86200']};
  const ic={
    Viewings:['sapphire','Manage and track property viewings','<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'],
    Maintenance:['emerald','Report and track maintenance','<path d="M14.7 6.3a5 5 0 0 0-6.9 6L3 17l4 4 4.7-4.8a5 5 0 0 0 6-6.9L14 13l-3-3z"/>'],
    Applications:['orange','View and manage rental applications','<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/>'],
    Messages:['purple','Chat with your landlord','<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'],
    Payments:['cyan','Rent payments and transaction history','<path d="M4 3h16v18l-3-2-3 2-3-2-3 2-4-2z"/><path d="M8 8h8M8 12h5"/>'],
    'Lease Contracts':['indigo','View and manage lease agreements','<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'],
    Inventory:['teal','View property inventory','<path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/>'],
    'Inspection List':['ruby','Property inspection and condition','<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'],
    Support:['amber','Get help and support','<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4"/><path d="M12 17h.01"/>'],
  };
  function orb(el,tone,svg){const[light,base,dark]=tones[tone];
    el.style.background=`radial-gradient(46% 36% at 30% 20%,rgba(255,255,255,1) 0%,rgba(255,255,255,.5) 38%,rgba(255,255,255,0) 66%),radial-gradient(68% 46% at 50% 108%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),radial-gradient(120% 118% at 42% 36%,${light} 0%,${base} 58%,${dark} 100%)`;
    el.style.boxShadow=`inset 0 0 0 1.4px rgba(255,255,255,.35),inset 0 3px 7px rgba(255,255,255,.6),inset 0 -9px 15px rgba(0,0,0,.20),0 8px 18px -5px ${base}75,0 2px 5px rgba(0,0,0,.12)`;
    el.innerHTML=`<span class="spec"></span><svg viewBox="0 0 24 24">${svg}</svg>`;}
  const grid=document.getElementById('grid');
  Object.keys(ic).forEach(label=>{const[tone,desc,svg]=ic[label];
    const d=document.createElement('div');d.className='tile';
    d.innerHTML=`<span class="g"></span><div class="tt"><div class="tl">${label}</div><div class="td">${desc}</div></div>`;
    grid.appendChild(d);orb(d.querySelector('.g'),tone,svg);});
  orb(document.getElementById('loc'),'sapphire','<path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>');
  orb(document.getElementById('shield'),'purple','<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>');
  document.getElementById('loc').querySelector('svg').style.width='18px';
  document.getElementById('loc').querySelector('svg').style.height='18px';
</script>
</body></html>

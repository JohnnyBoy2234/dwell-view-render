# Codemagic CI/CD — build both MzanziHomes iOS apps and publish to TestFlight.
# Lets you release from Windows: Codemagic runs the build on its own macOS machines.
#
# ── ONE-TIME SETUP in the Codemagic UI (Team settings) ───────────────────────
# 1. Connect this GitHub repo.
# 2. Integrations → App Store Connect: add an API key (Issuer ID + Key ID + .p8
#    from App Store Connect → Users and Access → Integrations). Name it exactly
#    "MzanziHomes ASC" (or change `app_store_connect:` below to match).
# 3. Create the two app records in App Store Connect first (bundle IDs
#    com.mzanzihomes.app and com.mzanzihomes.landlord) — Codemagic uploads to
#    existing records, it does not create them.
# 4. Environment variables → add a GROUP named "mzanzihomes_env" holding your
#    PRODUCTION web build vars (mark them Secure):
#       VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, and any other VITE_* your
#       apps read. These get baked into the web build.
# 5. In the Apple Developer portal, enable the **Push Notifications** capability
#    on BOTH App IDs. The apps now ship an aps-environment entitlement, so the
#    provisioning profile must include Push or code-signing will fail.
#
# Build numbers auto-increment via Codemagic's $BUILD_NUMBER, so every upload is
# unique (TestFlight requires this). Set the marketing version (1.0.0, 1.1.0…)
# in Xcode's MARKETING_VERSION when you cut a release.

definitions:
  scripts:
    - &npm_install
      name: Install dependencies (workspace root)
      script: npm ci
  base_env: &base_env
    node: 20
    xcode: latest
    cocoapods: default
    groups:
      - mzanzihomes_env
  base_publishing: &base_publishing
    app_store_connect:
      auth: integration
      submit_to_testflight: true
      # beta_groups:            # uncomment + name a group to auto-add external testers
      #   - Pilot testers

workflows:
  # ────────────────────────────────── TENANT ────────────────────────────────
  tenant-ios:
    name: Tenant app → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: MzanziHomes ASC
    environment:
      <<: *base_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mzanzihomes.app
      vars:
        APP_DIR: apps/tenant
        XCODE_WORKSPACE: apps/tenant/ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - *npm_install
      - name: Build web bundle
        script: npm run build --workspace $APP_DIR
      - name: Capacitor sync (copy web build into iOS)
        script: cd $APP_DIR && npx cap sync ios
      - name: Set unique build number
        script: cd $APP_DIR/ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: Install CocoaPods
        script: cd $APP_DIR/ios/App && pod install
      - name: Build signed IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing: *base_publishing

  # ───────────────────────────────── LANDLORD ───────────────────────────────
  landlord-ios:
    name: Landlord app → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: MzanziHomes ASC
    environment:
      <<: *base_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mzanzihomes.landlord
      vars:
        APP_DIR: apps/landlord
        XCODE_WORKSPACE: apps/landlord/ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - *npm_install
      - name: Build web bundle
        script: npm run build --workspace $APP_DIR
      - name: Capacitor sync (copy web build into iOS)
        script: cd $APP_DIR && npx cap sync ios
      - name: Set unique build number
        script: cd $APP_DIR/ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: Install CocoaPods
        script: cd $APP_DIR/ios/App && pod install
      - name: Build signed IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing: *base_publishing

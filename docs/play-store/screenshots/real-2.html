<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;background:linear-gradient(160deg,hsl(214,100%,14%) 0%,hsl(214,100%,32%) 100%);font-family:'Inter',-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:64px 40px 52px}
.caption{color:white;font-size:46px;font-weight:800;text-align:center;line-height:1.15;margin-bottom:48px;letter-spacing:-2px;max-width:880px}
.phone{width:400px;background:#0a0a0a;border-radius:54px;padding:12px;box-shadow:0 60px 140px rgba(0,0,0,0.65),0 0 0 1.5px rgba(255,255,255,0.08),inset 0 0 0 1px rgba(255,255,255,0.04);position:relative}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:108px;height:30px;background:#0a0a0a;border-radius:0 0 20px 20px;z-index:10}
.screen{border-radius:44px;overflow:hidden;width:100%}
.screen img{width:100%;display:block}
.brand{color:rgba(255,255,255,0.3);font-size:15px;font-weight:700;margin-top:40px;letter-spacing:3px;text-transform:uppercase}
</style></head><body>
<div class="caption">Browse verified rentals near you</div>
<div class="phone"><div class="notch"></div><div class="screen"><img src="/docs/play-store/screenshots/raw-1-properties.png"/></div></div>
<div class="brand">MzanziHomes</div>
</body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:2133px;overflow:hidden;background:linear-gradient(160deg,hsl(214,100%,14%) 0%,hsl(214,100%,32%) 100%);font-family:'Inter',-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 80px}
.caption{color:white;font-size:56px;font-weight:800;text-align:center;line-height:1.15;margin-bottom:64px;letter-spacing:-2px;max-width:1000px}
.tablet{width:620px;background:#0a0a0a;border-radius:42px;padding:12px;box-shadow:0 80px 180px rgba(0,0,0,0.65),0 0 0 1.5px rgba(255,255,255,0.08),inset 0 0 0 1px rgba(255,255,255,0.04);position:relative}
.camera{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:#1a1a1a;border-radius:50%;z-index:10}
.screen{border-radius:32px;overflow:hidden;width:100%}
.screen img{width:100%;display:block}
.brand{color:rgba(255,255,255,0.3);font-size:18px;font-weight:700;margin-top:52px;letter-spacing:3px;text-transform:uppercase}
</style></head><body>
<div class="caption">Get started in seconds</div>
<div class="tablet"><div class="camera"></div><div class="screen"><img src="raw-auth.png"/></div></div>
<div class="brand">MzanziHomes</div>
</body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;background:linear-gradient(140deg,hsl(214,100%,12%) 0%,hsl(214,100%,28%) 60%,hsl(214,95%,38%) 100%);font-family:'Inter',-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:52px 120px}
.caption{color:white;font-size:46px;font-weight:800;text-align:center;line-height:1.15;letter-spacing:-1.5px;max-width:1400px}
.window{width:1360px;background:#111;border-radius:10px;box-shadow:0 40px 120px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.07);overflow:hidden}
.titlebar{background:#1e1e1e;height:40px;display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:1px solid rgba(255,255,255,0.06)}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
.win-title{flex:1;text-align:center;font-size:12px;color:rgba(255,255,255,0.35);font-weight:500;margin-right:44px}
.win-body{padding:28px 0;display:flex;justify-content:center;align-items:flex-start;background:#0d0d0d;min-height:400px}
.phone{width:270px;background:#0a0a0a;border-radius:48px;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.06);position:relative;flex-shrink:0}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:82px;height:24px;background:#0a0a0a;border-radius:0 0 14px 14px;z-index:10}
.p-screen{border-radius:40px;overflow:hidden;width:100%}
.p-screen img{width:100%;display:block}
.brand{color:rgba(255,255,255,0.28);font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
</style></head><body>
<div class="caption">Find your perfect home in South Africa</div>
<div class="window">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <div class="win-title">MzanziHomes</div>
  </div>
  <div class="win-body">
    <div class="phone">
      <div class="notch"></div>
      <div class="p-screen"><img src="raw-0-home.png"/></div>
    </div>
  </div>
</div>
<div class="brand">MzanziHomes</div>
</body></html>

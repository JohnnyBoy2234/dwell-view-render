<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:2133px;overflow:hidden;background:linear-gradient(160deg,hsl(214,100%,14%) 0%,hsl(214,100%,32%) 100%);font-family:'Inter',-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 80px}
.caption{color:white;font-size:56px;font-weight:800;text-align:center;line-height:1.15;margin-bottom:60px;letter-spacing:-2px;max-width:1000px}
.tablet{width:620px;background:#0a0a0a;border-radius:22px;box-shadow:0 80px 180px rgba(0,0,0,0.65),0 0 0 1.5px rgba(255,255,255,0.08),inset 0 0 0 1px rgba(255,255,255,0.04);display:flex;flex-direction:column}
.t-bar{height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cam{width:12px;height:12px;background:#1e1e1e;border-radius:50%}
.screen{margin:0 12px;overflow:hidden;border-radius:2px}
.screen img{width:100%;display:block}
.b-bar{height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.home{width:62px;height:5px;background:#1e1e1e;border-radius:3px}
.brand{color:rgba(255,255,255,0.3);font-size:18px;font-weight:700;margin-top:48px;letter-spacing:3px;text-transform:uppercase}
</style></head><body>
<div class="caption">Everything you need to decide</div>
<div class="tablet">
  <div class="t-bar"><div class="cam"></div></div>
  <div class="screen"><img src="raw-2-property-detail.png"/></div>
  <div class="b-bar"><div class="home"></div></div>
</div>
<div class="brand">MzanziHomes</div>
</body></html>

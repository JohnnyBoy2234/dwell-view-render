<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{width:1080px;background:linear-gradient(160deg,hsl(214,100%,18%) 0%,hsl(214,100%,35%) 100%);font-family:'Inter',-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:56px 40px 48px}
    .caption{color:white;font-size:44px;font-weight:800;text-align:center;line-height:1.2;margin-bottom:44px;letter-spacing:-1.5px;max-width:860px}
    .phone{width:380px;background:#111;border-radius:52px;padding:14px;box-shadow:0 48px 120px rgba(0,0,0,0.55),0 0 0 2px rgba(255,255,255,0.07);position:relative}
    .screen{background:#f8fafc;border-radius:40px;overflow:hidden;width:100%}
    .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:#111;border-radius:0 0 18px 18px;z-index:10}
    .brand{color:rgba(255,255,255,0.45);font-size:18px;font-weight:700;margin-top:36px;letter-spacing:2px;text-transform:uppercase}
    .app{background:#f1f5f9;min-height:780px;border-radius:40px;overflow:hidden}
    .status-bar{background:transparent;height:44px;display:flex;align-items:flex-end;padding:0 20px 8px;justify-content:space-between;position:absolute;width:100%;z-index:5;top:0}
    .status-bar span{color:white;font-size:12px;font-weight:600}
    .hero{height:220px;background:linear-gradient(135deg,#93c5fd 0%,#60a5fa 50%,#3b82f6 100%);position:relative;display:flex;align-items:center;justify-content:center}
    .hero-emoji{font-size:64px;opacity:0.5}
    .hero-overlay{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,#f1f5f9)}
    .back-btn{position:absolute;top:50px;left:16px;background:white;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,0.15);z-index:6}
    .fav-btn{position:absolute;top:50px;right:16px;background:white;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,0.15);z-index:6}
    .body{padding:16px;background:#f1f5f9}
    .price{font-size:22px;font-weight:800;color:#1d4ed8}
    .price span{font-size:13px;font-weight:500;color:#94a3b8}
    .title{font-size:16px;font-weight:700;color:#0f172a;margin-top:4px}
    .loc{font-size:13px;color:#64748b;margin-top:4px;display:flex;align-items:center;gap:4px}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .chip{background:white;border:1.5px solid #e2e8f0;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:600;color:#475569}
    .section{margin-top:16px}
    .section-title{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:8px}
    .amenities{display:flex;flex-wrap:wrap;gap:8px}
    .amenity{background:white;border-radius:10px;padding:8px 12px;font-size:11px;color:#475569;font-weight:500;display:flex;align-items:center;gap:5px}
    .cta{background:#1d4ed8;color:white;border-radius:14px;padding:16px;text-align:center;font-size:15px;font-weight:700;margin-top:16px}
    .verified-banner{background:#dcfce7;border:1.5px solid #86efac;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;margin-top:14px}
    .verified-banner span{font-size:12px;color:#16a34a;font-weight:600}
  </style>
</head>
<body>
  <div class="caption">Everything you need to decide</div>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="app" style="position:relative">
        <div class="status-bar"><span>9:41</span><span>●●●</span></div>
        <div class="hero"><div class="hero-emoji">🏢</div><div class="hero-overlay"></div></div>
        <div class="back-btn">←</div>
        <div class="fav-btn">🤍</div>
        <div class="body">
          <div class="price">R 12,500 <span>/month</span></div>
          <div class="title">Modern 2 Bed Apartment</div>
          <div class="loc">📍 Sea Point, Cape Town</div>
          <div class="verified-banner"><span>✓</span><span>Verified Listing — ID confirmed by MzanziHomes</span></div>
          <div class="chips">
            <div class="chip">🛏 2 Bedrooms</div>
            <div class="chip">🚿 1 Bathroom</div>
            <div class="chip">🚗 1 Parking</div>
            <div class="chip">🐾 Pet Friendly</div>
            <div class="chip">🪑 Furnished</div>
          </div>
          <div class="section">
            <div class="section-title">Amenities</div>
            <div class="amenities">
              <div class="amenity">🏊 Pool</div>
              <div class="amenity">🔐 Security</div>
              <div class="amenity">📶 Fibre</div>
              <div class="amenity">🏋️ Gym</div>
            </div>
          </div>
          <div class="cta">Apply Now — Digital KYC</div>
        </div>
      </div>
    </div>
  </div>
  <div class="brand">MzanziHomes</div>
</body>
</html>

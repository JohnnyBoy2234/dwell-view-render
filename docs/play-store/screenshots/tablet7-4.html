<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:linear-gradient(160deg,hsl(214,100%,14%) 0%,hsl(214,100%,32%) 100%);font-family:'Inter',-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 60px}
.caption{color:white;font-size:48px;font-weight:800;text-align:center;line-height:1.15;margin-bottom:52px;letter-spacing:-2px;max-width:900px}
.tablet{width:520px;background:#0a0a0a;border-radius:18px;box-shadow:0 60px 140px rgba(0,0,0,0.65),0 0 0 1.5px rgba(255,255,255,0.08),inset 0 0 0 1px rgba(255,255,255,0.04);display:flex;flex-direction:column}
.t-bar{height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cam{width:10px;height:10px;background:#1e1e1e;border-radius:50%}
.screen{margin:0 10px;overflow:hidden;border-radius:2px}
.screen img{width:100%;display:block}
.b-bar{height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.home{width:52px;height:4px;background:#1e1e1e;border-radius:2px}
.brand{color:rgba(255,255,255,0.3);font-size:16px;font-weight:700;margin-top:40px;letter-spacing:3px;text-transform:uppercase}
</style></head><body>
<div class="caption">Manage all your properties in one place</div>
<div class="tablet">
  <div class="t-bar"><div class="cam"></div></div>
  <div class="screen"><img src="raw-3-dashboard.png"/></div>
  <div class="b-bar"><div class="home"></div></div>
</div>
<div class="brand">MzanziHomes</div>
</body></html>

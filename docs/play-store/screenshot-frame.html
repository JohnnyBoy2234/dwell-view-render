<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      background: linear-gradient(160deg, hsl(214,100%,18%) 0%, hsl(214,100%,35%) 100%);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 40px 48px;
    }
    .caption {
      color: white;
      font-size: 44px;
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 44px;
      letter-spacing: -1.5px;
      max-width: 860px;
    }
    .phone {
      width: 380px;
      background: #111;
      border-radius: 52px;
      padding: 14px;
      box-shadow: 0 48px 120px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.07);
      position: relative;
    }
    .screen {
      background: #fff;
      border-radius: 40px;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 9/19.5;
    }
    .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .notch {
      position: absolute;
      top: 14px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 28px;
      background: #111;
      border-radius: 0 0 18px 18px;
      z-index: 10;
    }
    .brand {
      color: rgba(255,255,255,0.45);
      font-size: 18px;
      font-weight: 700;
      margin-top: 36px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .placeholder {
      width: 100%;
      aspect-ratio: 9/19.5;
      background: linear-gradient(135deg, hsl(214,100%,90%) 0%, hsl(214,100%,80%) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: hsl(214,100%,40%);
      text-align: center;
      padding: 20px;
      border-radius: 40px;
    }
  </style>
</head>
<body>
  <!-- EDIT: Change this caption for each screenshot -->
  <div class="caption">Browse verified rentals near you</div>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <!-- EDIT: Replace with <img src="raw/screenshot-1.png" alt="App screenshot" /> once you have the raw screenshot -->
      <div class="placeholder">Replace with<br>screenshot-1.png</div>
    </div>
  </div>
  <div class="brand">MzanziHomes</div>
</body>
</html>
